name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The adapters suite runs real OCR. Without these, five of its tests fail
      # on a missing binary rather than on anything about the code.
      - name: Install poppler and tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr

      - run: npm ci

      - run: npm run typecheck

      # No GEMINI_API_KEY, so extraction replays recorded answers. Real OCR,
      # real validation, real routing still run.
      - run: npm test

      - run: npm run --workspace @invoice-extract/web build
